name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip project.zip
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; fi
          ls
      - name: Build
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong|error:|Execution failed|Unresolved|Could not" build.log | head -25 | while read -r line; do echo "::error::${line}"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: dmx-studio-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DMX-Studio.apk
          gh release create "build-${{ github.run_number }}" DMX-Studio.apk --title "DMX Studio build ${{ github.run_number }}" --notes "Debug APK"
